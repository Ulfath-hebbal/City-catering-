 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catering - Customer Registration</title>

<style>
/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

/* Body Background - Removed Image */
body {
    background-color: #e9ecef; /* Clean light grey */
    min-height: 100vh;
}

/* Header */
header {
    background: linear-gradient(to right, #088f62, #076e93);
    color: white;
    text-align: center;
    padding: 30px 20px;
}

.logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 15px;
    border: 3px solid white;
    background-color: white;
    padding: 5px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* Navbar */
.navbar {
    background: #011811;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.navbar ul {
    list-style: none;
    display: flex;
    justify-content: center;
}

.navbar ul li {
    position: relative;
}

.navbar ul li a {
    display: block;
    padding: 15px 25px;
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.navbar ul li a:hover {
    background: #ffeb3b;
    color: #5d4037;
}

/* Dropdown */
.dropdown-content {
    display: none;
    position: absolute;
    background: #011811;
    min-width: 160px;
    z-index: 100;
}

.dropdown-content a {
    color: white;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
}

.dropdown:hover .dropdown-content {
    display: block;
}

/* Form Box */
.formbox {
    width: 90%;
    max-width: 500px;
    background: white;
    padding: 30px;
    margin: 50px auto;
    border-radius: 12px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
}

/* Heading */
h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #5d4037;
    background-color: #ffeb3b;
    padding: 10px;
    border-radius: 50px;
    font-size: 1.4rem;
}

/* Form Elements */
label {
    font-size: 14px;
    font-weight: bold;
    color: #333;
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    transition: border 0.3s;
}

input:focus, textarea:focus {
    outline: none;
    border-color: #088f62;
    box-shadow: 0 0 5px rgba(8,143,98,0.2);
}

textarea {
    resize: vertical;
    height: 80px;
}

/* Button Container */
.btn-container {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

input[type="submit"], input[type="reset"] {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    transition: transform 0.2s, background 0.3s;
}

input[type="submit"] {
    background-color: #28a745;
    color: white;
}

input[type="submit"]:hover {
    background-color: #218838;
    transform: translateY(-1px);
}

input[type="reset"] {
    background-color: #dc3545;
    color: white;
}

input[type="reset"]:hover {
    background-color: #c82333;
    transform: translateY(-1px);
}

/* Footer */
footer {
    background: #212529;
    color: #adb5bd;
    text-align: center;
    padding: 20px;
    margin-top: 50px;
}

</style>
</head>

<body>

<!-- Header -->
<header>
    <!-- Note: Replace 'hg.jpeg' with your actual logo file path -->
    <img src="hg.jpeg" alt="Catering Logo" class="logo">
    <h1>City Catering Management System</h1>
</header>

<!-- Navbar -->
<nav class="navbar">
    <ul>
        <li><a href="home.php">Home</a></li>
        
    </ul>
</nav>

<!-- Form -->
<main class="formbox">
    <h2>Customer Registration</h2>

    <form method="post" action="cr.php">
        <label for="uname">Customer Name</label>
        <input type="text" id="uname" name="uname" placeholder="Enter Customer Name" required>

        <label for="mail">Email Address</label>
        <input type="email" id="mail" name="mail" placeholder="Enter Email" required>

        <label for="num">Phone Number</label>
        <input type="tel" id="num" name="num" placeholder="Enter Phone Number" required>

        <label for="area">Customer Address</label>
        <textarea id="area" name="area" placeholder="Enter full address details..." required></textarea>

        <div class="btn-container">
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </div>
    </form>
</main>

<!-- Footer -->
<footer>
    <p>&copy; 2026 City Catering Management System. All rights reserved.</p>
</footer>

</body>
</html>
