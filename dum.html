 <?php
// DB Connection - Replace with your actual credentials
$conn = mysqli_connect("localhost", "root", "", "catering_db");

// Get the search term from URL (from dropdown or search page)
$event_type = isset($_GET['event']) ? mysqli_real_escape_string($conn, $_GET['event']) : '';

// Query to find menus where 'event_type' matches the search
$query = "SELECT * FROM menus WHERE event_type LIKE '%$event_type%'";
$rs = mysqli_query($conn, $query);
?>

        <?php 
        if(mysqli_num_rows($rs) > 0) {
            while($row = mysqli_fetch_array($rs)) { 
        ?>
            <div class="food-card">
                <div class="card-content">
                    <div class="food-name"><?php echo $row['food']; ?></div>
                    <div class="price-tag">₹<?php echo $row['price']; ?></div>
                    <p style="font-size: 12px; color: #666;">Service: <?php echo $row['catering_name']; ?></p>
                    <form action="place_order.php" method="POST" style="margin-top:10px;">
                        <input type="hidden" name="food_id" value="<?php echo $row['id']; ?>">

                    </form>
                </div>
            </div>
        <?php 
            } 
        } else {
            echo "<p>No menus found for this category. <a href='catering_search.php'>Try another search.</a></p>";
        }
        ?>
    </div>
